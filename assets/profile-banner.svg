<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Mohamed Hany — Computing and Artificial Intelligence</title>
  <desc id="desc">A dark teal and violet abstract network graphic with a connected path of AI nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081522"/>
      <stop offset="0.58" stop-color="#10273A"/>
      <stop offset="1" stop-color="#1A2040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#48E0C0"/>
      <stop offset="1" stop-color="#9D8BFF"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#48E0C0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#48E0C0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#B8D7E8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="935" cy="180" r="205" fill="url(#halo)"/>
  <path d="M0 306C170 260 248 356 426 304S695 248 830 310s239 14 370-30v80H0z" fill="#0A1826" fill-opacity="0.42"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="78" y="132" fill="#F4F8FC" font-size="51" font-weight="700" letter-spacing="2">MOHAMED HANY</text>
    <rect x="80" y="158" width="178" height="4" rx="2" fill="url(#accent)"/>
    <text x="80" y="207" fill="#B9D5E3" font-size="19" font-weight="600" letter-spacing="2">COMPUTING × ARTIFICIAL INTELLIGENCE</text>
    <text x="80" y="258" fill="#E4EDF4" font-size="18">Learning by building — turning coursework into projects.</text>
    <g transform="translate(80 292)" font-size="12" font-weight="700" letter-spacing="1.1">
      <rect width="91" height="28" rx="14" fill="#143A42" stroke="#48E0C0" stroke-opacity="0.65"/>
      <text x="45.5" y="18" fill="#83F1D9" text-anchor="middle">PYTHON</text>
      <rect x="103" width="153" height="28" rx="14" fill="#25254A" stroke="#9D8BFF" stroke-opacity="0.7"/>
      <text x="179.5" y="18" fill="#C6BAFF" text-anchor="middle">AI + MACHINE LEARNING</text>
    </g>
  </g>

  <g transform="translate(932 181)">
    <circle r="128" fill="none" stroke="#9DB9CA" stroke-opacity="0.14"/>
    <circle r="91" fill="none" stroke="#9DB9CA" stroke-opacity="0.18" stroke-dasharray="3 9"/>
    <path d="M-94-36 -43-91 18-53 80-80 103-18 54 31 7 83 -59 61 -94-36Z" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-94-36 7 83M-43-91 54 31M18-53-59 61M80-80-94-36M103-18 7 83" fill="none" stroke="#9D8BFF" stroke-opacity="0.32" stroke-width="1.5"/>
    <g fill="#0F2637" stroke="#65E8CF" stroke-width="3">
      <circle cx="-94" cy="-36" r="8"/>
      <circle cx="-43" cy="-91" r="7"/>
      <circle cx="18" cy="-53" r="9"/>
      <circle cx="80" cy="-80" r="7"/>
      <circle cx="103" cy="-18" r="8"/>
      <circle cx="54" cy="31" r="7"/>
      <circle cx="7" cy="83" r="9"/>
      <circle cx="-59" cy="61" r="7"/>
    </g>
    <circle r="19" fill="#182B49" stroke="#B3A5FF" stroke-width="2"/>
    <text y="5" fill="#EEEAFE" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">AI</text>
  </g>

  <circle cx="1110" cy="72" r="3" fill="#48E0C0"/>
  <circle cx="1090" cy="290" r="4" fill="#9D8BFF"/>
  <circle cx="755" cy="68" r="2.5" fill="#E5C978"/>
</svg>
